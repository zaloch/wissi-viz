[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsiviz"
version = "0.1.0"
description = "GPU-accelerated (WebGL2) whole-slide image viewer for SVS/CZI/API slides with annotations, for the browser and NiceGUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "fastapi>=0.110",
  "tifffile>=2024.8.10",
  "zarr>=2.18",
  "imagecodecs>=2024.1.1",
  "pillow>=10",
  "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
czi = ["pylibCZIrw>=4.1"]
openslide = ["openslide-python>=1.3", "openslide-bin>=4.0"]
nicegui = ["nicegui>=2.0"]
server = ["uvicorn>=0.29"]
all = ["pylibCZIrw>=4.1", "openslide-python>=1.3", "openslide-bin>=4.0", "nicegui>=2.0", "uvicorn>=0.29", "orjson"]
dev = ["pytest", "httpx", "playwright", "scipy"]

[project.scripts]
wsiviz = "wsiviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wsiviz"]

[tool.ruff]
line-length = 120
