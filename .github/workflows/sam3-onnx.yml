# Checks that SAM 3 still works the way the app gets it: straight from the public ONNX export on Hugging Face
# (nrl-ai/anylearning-sam3-onnx, SHA-256 checked), quantized to int8 on the machine, finding the cat in a test picture.
# Nothing is published: wissi-viz does not host or redistribute SAM 3.
name: sam3-onnx
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'   # weekly: notice if the public file changes or disappears
  push:
    branches: [main]
    paths: [src/wissi_viz/sam3.py, scripts/sam3_inspect.py, .github/workflows/sam3-onnx.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Room (disk, swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          df -h / /mnt; free -g
      - name: Install
        run: |
          uv venv -p 3.12
          uv pip install -e ".[sam3]" pooch pytest pytest-github-actions-annotate-failures
      - name: Download from Hugging Face, quantize here, find the cat
        env:
          WISSI_TEST_SAM3: '1'
          XDG_CACHE_HOME: /mnt/cache
        run: |
          sudo mkdir -p /mnt/cache && sudo chown "$USER" /mnt/cache
          uv run --no-sync pytest -q -rfE tests/test_grounding.py -k real_sam3
          echo "::notice::$(cat /mnt/cache/*/models/sam3/NOTICE.txt 2>/dev/null | tr '\n' ' ')"
      - name: How the decoder makes its scores
        if: always()
        run: |
          d=$(ls /mnt/cache/*/models/sam3/sam3-decoder.onnx 2>/dev/null | head -1)
          [ -n "$d" ] && uv run --no-sync python scripts/sam3_inspect.py "$d" > /mnt/inspect.txt 2>&1 || true
          head -c 3800 /mnt/inspect.txt | tr '\n' '|' | sed 's/^/::notice::/'; echo
          tail -c +3800 /mnt/inspect.txt | head -c 3800 | tr '\n' '|' | sed 's/^/::notice::/'; echo
