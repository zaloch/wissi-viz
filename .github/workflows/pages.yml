# Publishes site/ (plus the screenshots and icon) to GitHub Pages.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: [site/**, docs/*.png, src/wissi_viz/assets/icon.svg, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site/img
          cp -r site/. _site/
          cp docs/*.png _site/img/
          cp src/wissi_viz/assets/icon.svg src/wissi_viz/assets/icon.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
