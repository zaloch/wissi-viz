# Tests on Linux, Windows and macOS (Intel + Apple silicon) with uv, then builds the sdist + wheel.
name: ci
on:
  push:
    paths-ignore: [site/**, docs/**, '*.md']
  pull_request:
  workflow_dispatch:

concurrency:                      # a new push cancels the previous run on the same branch
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]     # macos-latest = Apple silicon
        python: ["3.10", "3.13"]
        include:
          - {os: ubuntu-latest, python: "3.12"}
          - {os: macos-15-intel, python: "3.12"}               # Intel Mac
          - {os: ubuntu-24.04-arm, python: "3.13"}             # Linux ARM
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --extra analysis --extra io --extra polars --extra server --extra remote --extra bench --extra slideio --extra desktop
      - name: Chromium for the browser tests
        run: uv run playwright install --with-deps chromium
        shell: bash
      - name: Tests
        # failures are posted as annotations on the run (readable without the full log)
        run: uv run --with pytest-github-actions-annotate-failures pytest -q -rfE --durations=15
      - name: CLI smoke
        shell: bash
        run: |
          uv run wissi-viz --help
          uv run wissi-viz desktop --help

  sam:
    name: SAM 2.1 (PyTorch, CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install (CPU PyTorch)
        run: |
          run() { out=$("$@" 2>&1) || { echo "::error::$* :: $(echo "$out" | tail -c 2500 | tr '\n' ' ')"; exit 1; }; echo "$out" | tail -3; }
          run uv venv -p 3.12
          run uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          run uv pip install -e ".[analysis,sam]" pytest pytest-github-actions-annotate-failures
      - name: SAM tests with the real model
        env:
          WISSI_TEST_SAM: torch
          WISSI_SAM_MODEL: tiny
        run: uv run --no-sync pytest -q -rfE tests/test_sam.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: Wheel installs and imports on a clean interpreter
        run: |
          uv venv /tmp/w && VIRTUAL_ENV=/tmp/w uv pip install dist/*.whl
          /tmp/w/bin/python -c "import wissi_viz, wissi_viz.desktop as d; print(wissi_viz.__version__, d.icon_path('ico').exists())"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
