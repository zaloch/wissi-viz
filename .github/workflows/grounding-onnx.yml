# Exports Grounding DINO tiny (Apache-2.0) to ONNX from transformers (float32 + int8), checks wissi-viz's pipeline
# against the PyTorch model, and publishes the files as the GitHub release `grounding-dino-tiny-onnx-v1`, from
# which wissi-viz's "find by text" downloads them on first use.
name: grounding-onnx
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_grounding_onnx.py, src/wissi_viz/grounding.py, .github/workflows/grounding-onnx.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: |
          run() { out=$("$@" 2>&1) || { echo "::error::$* :: $(echo "$out" | tail -c 2500 | tr '\n' ' ')"; exit 1; }; echo "$out" | tail -3; }
          run uv venv -p 3.12
          run uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          run uv pip install transformers huggingface_hub onnx onnxruntime pooch timm
          run uv pip install -e ".[analysis]"
      - name: Build and check
        run: |
          step() {  # one stage; on failure, its exit status, peak memory and the end of its output as annotations
            rc=0
            /usr/bin/time -v -o /tmp/time.txt uv run --no-sync python scripts/build_grounding_onnx.py --out dist/grounding --step "$1" > /tmp/out.txt 2>&1 || rc=$?
            tail -40 /tmp/out.txt
            mem=$(grep -E "Maximum resident" /tmp/time.txt | awk '{print $NF}')
            echo "::notice::$1: exit $rc, peak $((mem / 1024)) MB"
            if [ $rc -ne 0 ]; then
              grep -v -E "unauthenticated|pci_bus_id|pre-processing before quantization" /tmp/out.txt > /tmp/err.txt || true
              grep -E '^(SUMMARY|CASE|MASKS)' /tmp/err.txt | tail -9 | cut -c1-1500 | sed 's/^/::notice::/' || true
              echo "::error::$(tail -3 /tmp/err.txt | tr '\n' ' ' | cut -c1-3000)"
              grep -E "^  File|Error|error" /tmp/err.txt | tail -9 | cut -c1-600 | sed 's/^/::warning::/'
              sudo dmesg 2>/dev/null | grep -i -E "killed process|out of memory" | tail -3 | sed 's/^/::error::/'
              exit 1
            fi
          }
          step export
          echo "::notice::$(grep -E '^(inputs|outputs|opset)' /tmp/out.txt | tr '\n' ' ' | tail -c 3000)"
          step quantize
          step check
          echo "::notice::$(uv run --no-sync python -c "import json;r=json.load(open('dist/grounding/check.json'));print(json.dumps({**r['summary'],**r['sizes_mb']}))")"
          curl -fsSL -o dist/grounding/LICENSE-Apache-2.0.txt https://www.apache.org/licenses/LICENSE-2.0.txt
          cd dist/grounding && sha256sum LICENSE-Apache-2.0.txt >> SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(uv run --no-sync python -c "import json;print(json.dumps(json.load(open('dist/grounding/check.json'))['summary']))")
          gh release view grounding-dino-tiny-onnx-v1 >/dev/null 2>&1 || gh release create grounding-dino-tiny-onnx-v1 \
            --title "Grounding DINO tiny ONNX (Apache-2.0)" \
            --notes "Grounding DINO tiny (IDEA Research, Apache-2.0) as ONNX for wissi-viz's find by text: exported from transformers (IDEA-Research/grounding-dino-tiny), plus an int8 copy. Checked against PyTorch (transformers): $S"
          gh release upload grounding-dino-tiny-onnx-v1 dist/grounding/*.onnx dist/grounding/vocab.txt \
            dist/grounding/SHA256SUMS dist/grounding/NOTICE.txt dist/grounding/LICENSE-Apache-2.0.txt dist/grounding/check.json --clobber
      - name: The published files work through wissi-viz
        env:
          WISSI_TEST_GROUNDING: '1'
        run: |
          uv pip install pytest pytest-github-actions-annotate-failures
          uv run --no-sync pytest -q -rfE tests/test_grounding.py -k real
