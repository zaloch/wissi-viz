# One-off look inside the rat DRG record (Zenodo 6546069): its files and annotation layout, to build the DRG case.
name: drg-probe
on:
  push:
    branches: [main]
    paths: [scripts/drg_probe.py, .github/workflows/drg-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run
        run: |
          sudo apt-get install -y -q 7zip libarchive-tools > /dev/null 2>&1 || sudo apt-get install -y -q p7zip-full libarchive-tools > /dev/null 2>&1 || true
          uv venv -p 3.12 -q && uv pip install -q numpy tifffile pillow
          uv run --no-sync python scripts/drg_probe.py "$RUNNER_TEMP/drg" > "$RUNNER_TEMP/p.txt" 2>&1 || true
          grep '^DRG' "$RUNNER_TEMP/p.txt" | head -c 3900 | tr '\n' '|' | sed 's/^/::notice::/'; echo
          grep '^DRG' "$RUNNER_TEMP/p.txt" | tail -c +3900 | head -c 3900 | tr '\n' '|' | sed 's/^/::notice::/'; echo
          tail -20 "$RUNNER_TEMP/p.txt"
