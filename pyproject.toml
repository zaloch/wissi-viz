[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wissi-viz"
version = "0.4.0"
description = "GPU-accelerated (WebGL2) whole-slide image viewer and spatial-analysis toolkit for brightfield and fluorescence histology (SVS/CZI/OME-TIFF/PathCore/HALO Link), for the browser and NiceGUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "G. Zeballos", email = "gzeballo@bu.edu" }]
# Core: permissive licences only (BSD / MIT / Apache-2.0 / ISC / HPND). Enforced by tests/test_licenses.py.
dependencies = [
  "numpy>=1.24",            # BSD-3
  "fastapi>=0.110",         # MIT
  "tifffile>=2024.8.10",    # BSD-3
  "zarr>=2.18",             # MIT
  "imagecodecs>=2024.1.1",  # BSD-3
  "czifile>=2026.10.14",    # BSD-3
  "pillow>=10",             # MIT-CMU (HPND)
  "mapbox-earcut>=1.0",     # ISC
]

[project.optional-dependencies]
# all permissive:
analysis = ["scipy>=1.11", "shapely>=2.0", "scikit-image>=0.22", "pandas>=2.0"]   # BSD-3
io = ["pyarrow>=14", "anndata>=0.10"]                                              # Apache-2.0, BSD-3
slideio = ["slideio>=2.6"]                     # BSD-3 (bundles OpenCV Apache-2.0, DCMTK BSD-3, OpenJPEG BSD-2): VSI/ZVI/DICOM/NDPI/SCN/AFI
nicegui = ["nicegui>=2.0"]                                                         # MIT
server = ["uvicorn>=0.29"]                                                         # BSD-3
remote = ["httpx>=0.27"]                                                           # BSD-3: HTTP client for RemoteConnection subclasses
bench = ["playwright>=1.40", "hypercorn>=0.16", "cryptography>=42", "uvicorn>=0.29"]  # Apache-2.0, MIT, Apache-2.0/BSD-3, BSD-3
all = ["wissi-viz[analysis,io,slideio,nicegui,server]"]
# opt-in, NOT permissive (LGPL): extra formats / alternative CZI backend
lgpl = ["pylibCZIrw>=4.1", "openslide-python>=1.3", "openslide-bin>=4.0"]
dev = ["pytest", "httpx", "playwright"]

[project.scripts]
wissi-viz = "wissi_viz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wissi_viz"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/wissi_loadtest.py" = "wissi_viz/loadtest.py"

[tool.ruff]
line-length = 120
