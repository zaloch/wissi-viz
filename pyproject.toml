[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wissi-viz"
dynamic = ["version"]
description = "GPU-accelerated (WebGL2) whole-slide image viewer and spatial-analysis toolkit for brightfield and fluorescence histology (SVS/CZI/OME-TIFF/PathCore/HALO Link), for the browser and NiceGUI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "G. Zeballos", email = "gzeballo@bu.edu" }]
# Core: permissive licences only (BSD / MIT / Apache-2.0 / ISC / HPND). Enforced by tests/test_licenses.py.
dependencies = [
  "numpy>=1.24",            # BSD-3
  "fastapi>=0.110",         # MIT
  "tifffile>=2024.8.10",    # BSD-3
  "zarr>=2.18",             # MIT
  "imagecodecs>=2024.1.1",  # BSD-3
  "czifile>=2019.7.2",      # BSD-3 (2026.x needs Python ≥3.12; 2019.7.2.x on 3.10–3.11)
  "pillow>=10",             # MIT-CMU (HPND)
  "mapbox-earcut>=1.0",     # ISC
  "truststore>=0.10",       # MIT (--system-certs: the OS certificate store for downloads)
  # MIT: SAM 2.1 (bundled, int8 ONNX) for click / box annotation and segment everything; no wheels for Intel Macs on
  # Python ≥ 3.14 (SAM falls back to the classic fill there)
  "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64' or python_version < '3.14'",
  "scipy>=1.11",            # BSD-3: masks → outlines (SAM), classic fallback
  "scikit-image>=0.22",     # BSD-3
  # the app window on macOS and Windows (pywebview BSD-3, uvicorn BSD-3), so a plain `uv run` / `pip install` keeps it;
  # Linux needs GTK or Qt bindings on top, so there it stays in the desktop extra
  "pywebview>=5; sys_platform == 'darwin' or sys_platform == 'win32'",
  "uvicorn>=0.29; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
# all permissive:
analysis = ["scipy>=1.11", "shapely>=2.0", "scikit-image>=0.22", "pandas>=2.0", "scikit-learn>=1.3"]   # BSD-3
io = ["pyarrow>=14", "anndata>=0.10"]                                              # Apache-2.0, BSD-3
slideio = ["slideio>=2.6; sys_platform != 'linux' or platform_machine != 'aarch64'"]  # BSD-3; no Linux ARM wheels (bundles OpenCV Apache-2.0, DCMTK BSD-3, OpenJPEG BSD-2): VSI/ZVI/DICOM/NDPI/SCN/AFI
nicegui = ["nicegui>=2.0"]                                                         # MIT
server = ["uvicorn>=0.29"]                                                         # BSD-3
polars = ["polars>=1.0"]                                                         # MIT: fastest table reader, ~½ the memory of pandas
remote = ["httpx>=0.27"]                                                           # BSD-3: HTTP client for RemoteConnection subclasses
bench = ["playwright>=1.40", "hypercorn>=0.16", "cryptography>=42", "uvicorn>=0.29"]  # Apache-2.0, MIT, Apache-2.0/BSD-3, BSD-3
# the viewer in its own window: pywebview (BSD-3) → WebView2 via pythonnet (MIT) on Windows, WKWebView via pyobjc (MIT)
# on macOS. Linux needs GTK or Qt bindings on top (LGPL/GPL, installed separately: see docs/INTEGRATION.md §12).
desktop = ["pywebview>=5", "uvicorn>=0.29"]
# SAM 2.1 click / box annotation (weights Apache-2.0). PyTorch route: transformers (Apache-2.0) + torch (BSD-3);
# no PyTorch wheels for Intel Macs, which use the ONNX route. ONNX route: ONNX Runtime (MIT); for GPUs install
# onnxruntime-gpu (CUDA) or onnxruntime-directml (any Windows GPU) instead.
sam = ["torch>=2.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
       "torchvision>=0.17; sys_platform != 'darwin' or platform_machine != 'x86_64'",
       "transformers>=4.56", "scipy>=1.11", "scikit-image>=0.22"]
sam-onnx = ["onnxruntime>=1.20", "scipy>=1.11", "scikit-image>=0.22"]   # now in the core install; kept for old commands
# everything permissive in one go: `uv sync --extra all` / `pip install "wissi-viz[all]"` (not lgpl). Includes PyTorch
# (sam) on platforms that have it, the desktop window, the HTTP client for tile APIs and the benchmark tools.
all = ["wissi-viz[analysis,io,slideio,nicegui,server,polars,remote,desktop,bench,sam,sam3]"]
# everything `wissi-viz --demo` / `--benchmark` use (add [sam] or [sam-onnx] for SAM 2.1, [cells] for Cellpose-SAM)
demo = ["wissi-viz[analysis,io,server,desktop,bench]"]
# SAM 3 (opt-in, downloaded from Hugging Face after you accept its licence): onnx (Apache-2.0) makes a faster int8
# copy on this computer; without it the float32 model is used.
sam3 = ["onnx>=1.16"]
# Cellpose-SAM for Find all → By text → Cellpose-SAM and `wissi-viz segment`. Opt-in, not in [all]: Cellpose is BSD-3
# but it requires fill-voids (LGPL-3.0). Needs PyTorch (no wheels for Intel Macs).
cells = ["cellpose>=4.0; sys_platform != 'darwin' or platform_machine != 'x86_64'"]
# opt-in, NOT permissive (LGPL): extra formats / alternative CZI backend
lgpl = ["pylibCZIrw>=4.1", "openslide-python>=1.3", "openslide-bin>=4.0"]
dev = ["pytest", "httpx", "playwright"]   # pip users; uv uses the dev dependency group below

[project.scripts]
wissi-viz = "wissi_viz.cli:main"

[project.urls]
Homepage = "https://zaloch.github.io/wissi-viz/"
Repository = "https://github.com/zaloch/wissi-viz"
Documentation = "https://github.com/zaloch/wissi-viz/blob/main/docs/GUIDE.md"

[project.gui-scripts]
wissi-viz-app = "wissi_viz.desktop:gui_main"     # no console window on Windows

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
# `uv sync` installs the dev group; `uv lock` must find wheels for every desktop/server platform we support.
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wissi_viz"]

[tool.hatch.version]
path = "src/wissi_viz/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs/*.png", "docs/*.gif", ".github", "benchmarks/probe_reports"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/wissi_loadtest.py" = "wissi_viz/loadtest.py"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["benchmarks/probe_reports"]  # generated settings snippets

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, comprehensions, blind / silent excepts, stale noqa.
# Imports inside functions are checked by tests/test_style.py: only optional extras may be imported lazily.
select = ["E", "F", "W", "I", "B", "UP", "C4", "BLE", "RUF100"]
ignore = [
  "B008",   # FastAPI Query(...) defaults
  "B905",   # zip() without strict= (3.10+ only)
  "E731",   # small lambdas assigned to names
  "E501",   # long lines: the formatter wraps code; long strings and URLs stay whole
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "B018"]
"benchmarks/*" = ["BLE001", "B023"]  # browser drivers define helpers per page and call them in the same iteration
"examples/*" = ["BLE001"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
known-first-party = ["wissi_viz"]
