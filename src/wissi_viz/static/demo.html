<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wissi-viz</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #e6e6e6; font: 13px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; border-bottom: 1px solid #222; }
  header b { margin-right: 6px; }
  select, input, button { background: #1a1d22; color: inherit; border: 1px solid #333; border-radius: 6px; padding: 4px 6px; font: inherit; }
  button.on { background: #1f4f7a; border-color: #3ea6ff; }
  input.num { width: 90px; }
  wsi-grid { flex: 1; min-height: 0; }
  #log { font: 11px ui-monospace, monospace; opacity: .75; padding: 4px 10px; height: 18px; overflow: hidden; white-space: nowrap; border-top: 1px solid #222; }
</style>
<script type="module" src="__API__/static/index.js"></script>
</head>
<body>
<header>
  <b>wissi-viz</b>
  <label>Panes <select id="n"></select></label>
  <label>Sync <select id="sync"><option>none</option><option>all</option><option>pan</option><option>zoom</option></select></label>
  <span id="tools"></span>
  <span>Go to (µm or px):
    <input id="gx" class="num" placeholder="x"> <input id="gy" class="num" placeholder="y">
    <select id="gu"><option value="px">px</option><option value="um">µm</option></select>
    <select id="gm"><option value="">keep zoom</option><option>2.5</option><option>5</option><option>10</option><option>20</option><option>40</option></select>×
    <select id="gp"><option value="active">active pane</option><option value="all">all panes</option></select>
    <button id="go">Go</button></span>
  <button id="fit">Fit all</button>
</header>
<wsi-grid id="grid" api="__API__" draw-layer="Drawings"></wsi-grid>
<div id="log"></div>
<script type="module">
  const grid = document.getElementById('grid');
  const log = (m) => (document.getElementById('log').textContent = m);
  const slides = await (await fetch('__API__/slides')).json();
  const sel = document.getElementById('n');
  for (let i = 1; i <= 16; i++) sel.add(new Option(i, i));
  const setN = (n) => grid.setSlides(Array.from({ length: n }, (_, i) => slides[i % slides.length].id));
  sel.value = Math.min(4, Math.max(1, slides.length));
  sel.onchange = () => setN(+sel.value);
  await customElements.whenDefined('wsi-grid');
  setN(+sel.value);
  document.getElementById('sync').onchange = (e) => grid.setSync(e.target.value);
  const tools = ['pan', 'point', 'rect', 'ellipse', 'polygon', 'freehand', 'line'];
  const tb = document.getElementById('tools');
  for (const t of tools) {
    const b = document.createElement('button');
    b.textContent = t; b.className = t === 'pan' ? 'on' : '';
    b.onclick = () => { grid.setTool(t); [...tb.children].forEach((c) => c.classList.toggle('on', c === b)); };
    tb.appendChild(b);
  }
  document.getElementById('go').onclick = () => {
    const m = document.getElementById('gm').value;
    grid.goTo(document.getElementById('gp').value, +document.getElementById('gx').value, +document.getElementById('gy').value,
      { units: document.getElementById('gu').value, ...(m ? { magnification: +m } : {}) });
  };
  document.getElementById('fit').onclick = () => grid.fit('all');
  grid.addEventListener('viewchange', (e) => { const d = e.detail; if (d.pane === grid.active) log(`pane ${d.pane}: ${d.x.toFixed(0)}, ${d.y.toFixed(0)} px · ${d.magnification ? d.magnification.toFixed(1) + '×' : d.zoom.toFixed(3)} · ${JSON.stringify(grid.stats())}`); });
  grid.addEventListener('objectclick', (e) => log(`object: ${e.detail.layer} #${e.detail.index} ${e.detail.class} ${JSON.stringify(e.detail.properties || {})}`));
  grid.addEventListener('draw', (e) => log(`drew ${e.detail.geometry.type} on pane ${e.detail.pane}`));
  window.grid = grid;
</script>
</body>
</html>
