# Find all against reference outlines (wissi-viz validate): NuInsSeg H&E nuclei (hand-drawn), rat DRG neurons (3 experts),
# CAMELYON16 metastases
# (pathologists' outlines) and Xenium nuclei (10x, DAPI). Publishes the layers, the NuInsSeg mosaic, the scores and
# pictures as the GitHub release `validation` (replaced on every run), which `wissi-viz validate open` shows in the app.
name: validate
on:
  workflow_dispatch:
  schedule:
    - cron: '41 7 * * 2'   # weekly
  push:
    branches: [main]
    paths: [src/wissi_viz/validation.py, src/wissi_viz/evaluate.py, .github/workflows/validate.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WISSI_SAM3_ACCEPT_LICENSE: '1'   # the repository owner accepted the SAM License; SAM 3 itself is not published
      XDG_CACHE_HOME: /mnt/cache
      WISSI_PACK_DIR: /mnt/pack
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Room (disk, swap)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile && sudo chmod 600 /mnt/swapfile && sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          sudo mkdir -p /mnt/cache /mnt/pack && sudo chown "$USER" /mnt/cache /mnt/pack
          df -h / /mnt; free -g
      - name: Install
        run: |
          sudo apt-get install -y -q 7zip libarchive-tools > /dev/null 2>&1 || sudo apt-get install -y -q p7zip-full libarchive-tools > /dev/null 2>&1 || true
          uv venv -p 3.12 -q
          uv pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          uv pip install -q -e ".[analysis,io,sam3,cells]" pyarrow
      - name: Run
        run: |
          uv run --no-sync wissi-viz validate run --yes > "$RUNNER_TEMP/run.txt" 2>&1 || {
            echo "::error::validate run failed :: $(grep -v -E 'pci_bus_id|unauthenticated|quantization' "$RUNNER_TEMP/run.txt" | tail -c 3500 | tr '\n' ' ')"; exit 1; }
          grep -v -E "pci_bus_id|unauthenticated|quantization" "$RUNNER_TEMP/run.txt" | tail -80
          echo "::notice::$(grep -E '^  [a-z0-9-]+: ' "$RUNNER_TEMP/run.txt" | tr '\n' '|' | head -c 3800)"
          echo "::notice::$(tr '\n' ' ' < /mnt/pack/validation/validation.md | head -c 3800)"
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(uv run --no-sync wissi-viz validate publish-list 2>/dev/null) || exit 0
          [ -n "$files" ] || exit 0
          gh release view validation >/dev/null 2>&1 || gh release create validation --prerelease --title "Find all against reference outlines (latest run)" \
            --notes "Layers, the NuInsSeg mosaic (CC BY 4.0, see NUINSSEG-ATTRIBUTION.md), scores (validation.md) and pictures from the latest run of .github/workflows/validate.yml. Open them in the app with: wissi-viz validate open. No model weights are published here."
          # shellcheck disable=SC2086
          gh release upload validation $files --clobber
